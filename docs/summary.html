const byKey = (trades, keyOf) => [...trades.reduce((m, t) => m.set(keyOf(t), [...(m.get(keyOf(t)) ?? []), t]), new Map())].sort(([a], [b]) => (a > b ? 1 : -1));
const MONTHS = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];

function equityChart(canvas, trades, start) {
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue("--accent").trim(), grid = css.getPropertyValue("--border").trim(), muted = css.getPropertyValue("--muted").trim();
  let bal = start;
  const sorted = [...trades].sort((a, b) => Date.parse(a.exitTime) - Date.parse(b.exitTime));
  const points = [{ x: Date.parse(sorted[0]?.entryTime ?? 0), y: start }, ...sorted.map((t) => ({ x: Date.parse(t.exitTime), y: (bal += t.net) }))];
  new Chart(canvas, {
    type: "line",
    data: { datasets: [
      { label: "เงินในบัญชี", data: points, borderColor: accent, borderWidth: 1.5, pointRadius: 0, tension: 0 },
      { label: "เงินต้น", data: [{ x: points[0].x, y: start }, { x: points.at(-1).x, y: start }], borderColor: muted, borderDash: [4, 4], borderWidth: 1, pointRadius: 0 },
    ] },
    options: {
      maintainAspectRatio: false, animation: false, parsing: false, normalized: true,
      interaction: { mode: "nearest", axis: "x", intersect: false },
      scales: {
        x: { type: "linear", grid: { color: grid }, ticks: { color: muted, maxTicksLimit: 8, callback: (v) => date(v) } },
        y: { grid: { color: grid }, ticks: { color: muted } },
      },
      plugins: {
        legend: { labels: { color: muted, boxWidth: 12 } },
        tooltip: { callbacks: { title: (items) => dateTime(items[0].parsed.x), label: (i) => ` ${i.dataset.label}: ${money(i.parsed.y)}` } },
      },
    },
  });
}

// ---------- scalp ทุน 100 ดอลลาร์: กฎ S3d (SCALP_S3D) ----------
// ผลจำลองเมื่อฝึกโมเดลด้วยการสุ่มลำดับข้อมูล 6 ชุด (research/JOURNAL.md ลูปที่ 7): กำไรสุทธิเป็นดอลลาร์ต่อ 0.01 lot = % ของทุน 100
// คอลัมน์: ชุด, ปี 2024, 01/2025–02/2026 (ช่วงที่ใช้หากฎ), 03–06/2026, 07–09/2026, 6 เดือนล่าสุด 04–09/2026
const SCALP_SEEDS = [
  ["0 (ชุดที่ cBot ใช้)", -17, 180, 22, 34, 25],
  ["1", -22, 106, 39, 21, -6],
  ["2", -33, 121, 8, 11, 21],
  ["3", -39, 166, 55, -8, -31],
  ["4", -25, 166, 92, 11, 34],
  ["5", -17, 135, 55, -20, -32],
];

/** รอบที่รันด้วยข้อมูล tick เงินต้น 100 ของกฎเวอร์ชันล่าสุดและ SL ล่าสุด — ช่วงวันที่ซ้ำกันเอารอบล่าสุด */
async function tickRuns(code) {
  const { data, error } = await sb.from("backtest_runs")
    .select("id, date_from, date_to, note, created_at, start_balance, net_profit, win_rate, profit_factor, max_dd_pct, total_trades, params, strategy:strategies!inner(code, version)")
    .eq("strategy.code", code).order("created_at", { ascending: false }).limit(200);
  if (error) throw error;
  const latest = Math.max(0, ...data.map((r) => r.strategy?.version ?? 0));
  const runs = data.filter((r) => /tick/i.test(r.note ?? "") && Number(r.start_balance) === 100 && r.strategy?.version === latest);
  const stop = Number(runs[0]?.params?.StopUsd);                // SL ของรอบล่าสุด = ค่าที่ใช้อยู่ตอนนี้; ตารางแสดงเฉพาะรอบที่ใช้ SL นี้
  const seen = new Set();
  const ticks = runs.filter((r) => Number(r.params?.StopUsd) === stop)
    .filter((r) => { const k = `${(r.date_from ?? "").slice(0, 10)}|${(r.date_to ?? "").slice(0, 10)}`; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => (a.date_from ?? "").localeCompare(b.date_from ?? ""));
  return { latest, stop, ticks, total: ticks.reduce((s, r) => s + Number(r.net_profit ?? 0), 0) };
}

function tickTable({ ticks, total }) {
  if (!ticks.length) return h("p", { class: "empty" }, "ยังไม่มีรอบที่รันด้วยข้อมูล tick");
  return h("div", { class: "table-wrap" }, h("table", {},
    h("thead", {}, h("tr", {}, ["ช่วง", "เทรด", "Win", "PF", "Net", "Max DD", "รอบ"].map((t, i) => h("th", { class: i ? "num" : null }, t)))),
    h("tbody", {},
      ticks.map((r) => h("tr", { class: `link${r.total_trades < 30 ? " weak" : ""}`, tabindex: 0, onclick: () => location.href = `run.html?id=${r.id}` },
        h("td", {}, `${date(r.date_from)} – ${date(r.date_to)}`),
        h("td", { class: "num" }, r.total_trades),
        h("td", { class: "num" }, pct(r.win_rate)),
        h("td", { class: "num" }, num(r.profit_factor)),
        h("td", { class: `num ${signClass(r.net_profit)}` }, money(r.net_profit)),
        h("td", { class: "num" }, pct(r.max_dd_pct)),
        h("td", { class: "num" }, `#${r.id}`))),
      h("tr", { class: "group" }, h("td", {}, "รวมทุกช่วงที่รันแล้ว"), h("td", { class: "num" }, ticks.reduce((s, r) => s + (r.total_trades ?? 0), 0)),
        h("td", {}), h("td", {}), h("td", { class: `num ${signClass(total)}` }, money(total)), h("td", {}), h("td", {})))));
}

// ---------- ทักษะการทำนายบนกราฟ Heikin Ashi (HA_PREDICT): cBot นับว่าทายถูกกี่แท่ง ไม่เปิดออเดอร์ ----------
// ตัวเลขมาจากโน้ตของรอบทดสอบที่ cBot เขียนเอง: "...ถูก 82.35% จาก 30,032 แท่ง · เฉพาะตอนราคาห่างชัดเจน: 92.13% (63.57% ของแท่ง) · ...ราคาจริง...: ถูก 48.93%"
async function heikinSection() {
  const { data, error } = await sb.from("backtest_runs")
    .select("id, date_from, date_to, note, created_at, timeframe, strategy:strategies!inner(code)")
    .eq("strategy.code", "HA_PREDICT").order("created_at", { ascending: false }).limit(100);
  if (error) throw error;
  const seen = new Set();
  const rows = data
    .filter((r) => { const k = `${(r.date_from ?? "").slice(0, 10)}|${(r.date_to ?? "").slice(0, 10)}`; if (seen.has(k)) return false; seen.add(k); return true; })
    .map((r) => {
      const m = /ถูก ([\d.]+)% จาก ([\d,]+) แท่ง.*?ชัดเจน: ([\d.]+)% \(([\d.]+)% ของแท่ง\).*?ถูก ([\d.]+)%/.exec(r.note ?? "");
      return m && { r, pct: +m[1], bars: +m[2].replace(/,/g, ""), farPct: +m[3], farShare: +m[4], realPct: +m[5] };
    })
    .filter(Boolean).sort((a, b) => (a.r.date_from ?? "").localeCompare(b.r.date_from ?? ""));
  if (!rows.length) return "";
  const bars = rows.reduce((s, x) => s + x.bars, 0);
  const avg = (f) => rows.reduce((s, x) => s + f(x) * x.bars, 0) / bars;
  const cell = (v) => h("td", { class: "num" }, `${v.toFixed(2)}%`);
  const examples = h("section", { class: "stack" });           // ภาพตัวอย่างจากข้อมูลจริง (ha-examples.js) — ว่างไว้ถ้าโหลดไม่ได้
  renderHaExamples(examples);
  return h("section", { class: "stack" },
    h("div", {},
      h("h1", {}, "ทักษะการทำนาย: แท่ง Heikin Ashi 1 นาที"),
      h("p", { class: "muted" }, "ทอง XAUUSD · กราฟ Hm1 · ข้อมูล tick · ทายตอนแท่งเปิดว่าแท่งนั้นจะจบเป็นแท่งขึ้นหรือลง · ไม่เปิดออเดอร์ ไม่คิดสเปรด")),
    h("section", { class: "card" },
      h("h2", {}, `ทายถูก ${avg((x) => x.pct).toFixed(1)}% จาก ${bars.toLocaleString("en-US")} แท่ง — ผ่านเป้า 80%`),
      h("p", {}, h("b", {}, "วิธีทาย: "), "ตอนแท่ง Heikin Ashi ใหม่เปิด ถ้าราคาจริงอยู่สูงกว่าราคาเปิดของแท่งนั้น → ทายว่าจบเป็นแท่งขึ้น, ต่ำกว่า → แท่งลง"),
      h("ul", {},
        h("li", {}, `ถ้าทายเฉพาะตอนที่ราคาห่างจากราคาเปิดของแท่งอย่างชัดเจน (${avg((x) => x.farShare).toFixed(0)}% ของแท่ง) จะถูก ${avg((x) => x.farPct).toFixed(1)}%`),
        h("li", {}, h("b", {}, "ข้อควรรู้: "), `การทายชุดเดียวกัน เมื่อวัดกับราคาจริงของนาทีนั้น ถูกแค่ ${avg((x) => x.realPct).toFixed(1)}% — `,
          "แท่ง Heikin Ashi เป็นค่าเฉลี่ย ราคาเปิดของแท่งคือจุดกึ่งกลางของแท่งก่อน ไม่ใช่ราคาที่ซื้อขายได้ ความแม่นนี้จึงมาจากสูตรของแท่ง ไม่ได้แปลว่ารู้ว่าราคาจริงจะไปทางไหน"))),
    examples,
    h("h2", {}, "ผล backtest ใน cTrader รายช่วง"),
    h("div", { class: "table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, ["ช่วง", "จำนวนแท่ง", "ทายถูก", "ทายถูกเมื่อราคาห่างชัดเจน", "สัดส่วนแท่งที่ชัดเจน", "ราคาจริงไปตามที่ทาย", "รอบ"].map((t, i) => h("th", { class: i ? "num" : null }, t)))),
      h("tbody", {},
        rows.map((x) => h("tr", { class: "link", tabindex: 0, onclick: () => location.href = `run.html?id=${x.r.id}` },
          h("td", {}, `${date(x.r.date_from)} – ${date(x.r.date_to)}`),
          h("td", { class: "num" }, x.bars.toLocaleString("en-US")),
          cell(x.pct), cell(x.farPct), cell(x.farShare), cell(x.realPct),
          h("td", { class: "num" }, `#${x.r.id}`))),
        h("tr", { class: "group" }, h("td", {}, "รวมทุกช่วง"), h("td", { class: "num" }, bars.toLocaleString("en-US")),
          cell(avg((x) => x.pct)), cell(avg((x) => x.farPct)), cell(avg((x) => x.farShare)), cell(avg((x) => x.realPct)), h("td", {}))))));
}

async function load() {
  mountJobs();
  const [heikin, scalp] = await Promise.all([heikinSection(), scalpSection()]);
  const { data: runs, error } = await sb.from("backtest_runs")
    .select("*, strategy:strategies!inner(id, code, version, name, theory)")
    .eq("strategy.code", CODE).order("created_at", { ascending: false }).limit(200);
  if (error) throw error;

  const mine = runs.filter((r) => same(r.params) && Number(r.start_balance) === 1000);
  const found = PERIODS.map((p) => ({ p, run: mine.find((r) => (r.date_from ?? "") >= p.from && (r.date_from ?? "") < p.to) })).filter((x) => x.run);
  const main = $("#main"), jobs = $("#main .jobs");
  if (found.length < PERIODS.length) {
    main.replaceChildren(jobs, heikin, scalp, h("h1", {}, "สรุป"), h("p", { class: "empty" }, "ยังไม่มีผลทดสอบของทฤษฎีตัวเต็งครบทั้ง 3 ช่วง"));
    return;
  }
  const files = await Promise.all(found.map((x) => labApi(`/runs/${x.run.id}/file`)));
  const canvases = found.map((x) => h("canvas", { "aria-label": `เงินในบัญชี ${x.p.label}` }));
  const allPass = found.every((x) => x.run.net_profit > 0);
  const worstDd = Math.max(...found.map((x) => x.run.max_dd_pct ?? 0));

  main.replaceChildren(
    jobs,
    heikin,
    scalp,
    h("div", {},
      h("h1", {}, "ถือข้ามช่วงเวลา (บัญชี 1,000 ดอลลาร์): กฎ R1"),
      h("p", { class: "muted" }, "ทอง XAUUSD · แท่ง M1 จริง · ช่วงทดสอบเดิม 2020–09/2026 · ต้นทุนบัญชี Razor (0.22 ดอลลาร์ต่อออนซ์ต่อรอบ) · เงินต้น 1,000 · 0.01 lot ต่อไม้ · ปิดทุกไม้ก่อนหมดวัน")),
    h("section", { class: "card" },
      h("h2", {}, allPass ? "กำไรหลังหักต้นทุนครบทั้ง 3 ช่วง — แต่ยังไม่ใช่ข้อพิสูจน์" : "ยังไม่ผ่านครบทั้ง 3 ช่วง"),
      h("p", {}, h("b", {}, found[0].run.strategy.name), ": ", found[0].run.strategy.theory),
      h("p", {}, "กฎนี้ถูกล็อกจากช่วงสำรวจ แล้วจึงเปิดดูช่วงตรวจสอบและช่วงสุดท้ายอย่างละครั้ง ",
        allPass ? "ทั้งสามช่วงเป็นบวก " : "", `แต่ drawdown สูงสุดถึง ${pct(worstDd)} ของบัญชี ซึ่งสูงเกินกว่าจะใช้จริงด้วยขนาดไม้นี้ `,
        "และ backtest พิสูจน์กำไรจริงไม่ได้ ขั้นต่อไปคือทดสอบเดินหน้าในบัญชี Demo")),

    h("div", { class: "table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, ["ช่วง", "วันที่", "เทรด", "Win", "PF", "Net", "Max DD"].map((t, i) => h("th", { class: i >= 2 ? "num" : null }, t)))),
      h("tbody", {}, found.map(({ p, run }) => h("tr", { class: "link", tabindex: 0, onclick: () => location.href = `run.html?id=${run.id}` },
        h("td", {}, h("b", {}, p.label), h("span", { class: "muted" }, ` · ${p.note}`)),
        h("td", {}, `${date(run.date_from)} – ${date(run.date_to)}`),
        h("td", { class: "num" }, run.total_trades),
        h("td", { class: "num" }, pct(run.win_rate)),
        h("td", { class: "num" }, num(run.profit_factor)),
        h("td", { class: `num ${signClass(run.net_profit)}` }, money(run.net_profit)),
        h("td", { class: "num" }, pct(run.max_dd_pct))))))),

    h("section", { class: "card theory" },
      h("h2", {}, "ใช้ยังไง"),
      h("p", { class: "muted" }, "เวลาด้านล่างเป็นเวลาไทย · สองไม้เป็นอิสระต่อกัน ถือพร้อมกันได้สูงสุด 2 ไม้"),
      h("ol", {},
        h("li", {}, `จดราคาทองตอน ${thai(0)} น. (ต้นวันของตลาด)`),
        h("li", {}, `ตอน ${thai(FINAL.Hour1)} น. ดูว่าราคาห่างจากราคาต้นวันเท่าไร เทียบกับ "ขนาดปกติ" ของระยะห่างนี้ใน ${FINAL.Lookback} วันที่ผ่านมา`),
        h("li", {}, `ถ้าห่างเกิน ${FINAL.Threshold} เท่าของขนาดปกติ → เข้าตามทิศนั้น (ขึ้นมา = Buy, ลงมา = Sell) ถ้าไม่ถึง ไม่เข้า`),
        h("li", {}, `ตอน ${thai(FINAL.Hour2)} น. ทำแบบเดียวกันอีกครั้งเป็นไม้ที่สอง`),
        h("li", {}, "ถือทุกไม้ถึง 03:45 น. แล้วปิด ไม่ว่ากำไรหรือขาดทุน · รุ่นนี้ยังไม่มี SL/TP")),
      h("p", { class: "muted" }, "\"ขนาดปกติ\" คือรากของค่าเฉลี่ยกำลังสองของระยะห่างเดียวกันใน 60 วันทำการก่อนหน้า cBot คำนวณให้เอง (ทฤษฎี CH_SESSION_MOM)")),

    ...found.map((x, i) => periodSection(x.p, x.run, files[i].trades ?? [], canvases[i])),

    h("section", { class: "card" },
      h("h2", {}, "ข้อควรระวัง"),
      h("ul", {},
        h("li", {}, "Drawdown สูงมาก: 0.01 lot คือขนาดเล็กสุดที่เทรดได้ และที่ราคาทองปัจจุบันหนึ่งไม้แกว่งได้หลายสิบดอลลาร์ต่อวัน บัญชี 1,000 ดอลลาร์จึงเล็กเกินไปสำหรับกฎนี้"),
        h("li", {}, "กำไรมาจากปีที่ตลาดแกว่งแรง (2020, 2024–2026) ส่วนปี 2021–2023 แทบเท่าทุน"),
        h("li", {}, "ช่วงสุดท้ายมีเทรดแค่ราวร้อยครั้ง สามเดือนแรกขาดทุน และฝั่ง Sell ติดลบ — กำไรรวมของช่วงนี้ยังอาจเป็นโชคได้"),
        h("li", {}, "ทฤษฎีนี้ถูกเลือกจากการทดสอบหลายสิบแบบ จึงมีโอกาสที่มันดูดีเพราะบังเอิญ"),
        h("li", {}, "คิดสเปรดคงที่ ไม่มี slippage และยังไม่ได้วัดสเปรดจริงของบัญชี"),
        h("li", {}, "ทฤษฎีรวมรุ่นก่อน (เบรก High วันก่อน + กรอบเอเชีย) ไม่ผ่านช่วงสุดท้าย ดูได้ในหน้าทฤษฎีกราฟ"))),
  );
  found.forEach((x, i) => { const t = files[i].trades ?? []; if (t.length) equityChart(canvases[i], t, Number(x.run.start_balance)); });
}

const session = await requireSession();
if (session) {
  try { await load(); } catch (e) { $("#main").replaceChildren(); showError(e); }
}
</script>
