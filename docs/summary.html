<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backtest Lab · สรุป</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stack" id="main"><p class="muted">กำลังโหลด…</p></main>
<script type="module">
import Chart from "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/auto/+esm";
import { sb, requireSession, labApi, h, $, money, pct, num, date, dateTime, signClass, showError,
  WEEKDAYS, tradeStats, weekdayStats, splitBar, mountJobs } from "./app.js";

// ---------- ทฤษฎีที่กำลังเป็นตัวเต็ง (ดู research/JOURNAL.md ใน repo) ----------
// ตัวเลขทั้งหมดในหน้าคำนวณจากผลทดสอบจริงใน lab; กฎถูกล็อกจากช่วง "สำรวจ" ก่อนเปิดดูสองช่วงหลัง
const CODE = "CH_SESSION_MOM";
const FINAL = { Threshold: 0.75, Lookback: 60, Hour1: 7, Hour2: 10 };
const KEYS = Object.keys(FINAL);
const PERIODS = [
  { key: "explore", label: "ช่วงสำรวจ", note: "ใช้หากฎ — ตัวเลขช่วงนี้ดีเกินจริงเสมอ", from: "0000", to: "2025-01-01" },
  { key: "validate", label: "ช่วงตรวจสอบ", note: "เปิดดูครั้งเดียวหลังล็อกกฎ", from: "2025-01-01", to: "2026-03-01" },
  { key: "holdout", label: "ช่วงสุดท้าย", note: "ข้อมูลล่าสุดที่ไม่เคยใช้หากฎ — ตัวเลขที่ควรเชื่อที่สุด", from: "2026-03-01", to: "9999" },
];
const thai = (hourUtc) => `${String((hourUtc + 7) % 24).padStart(2, "0")}:00`;

const same = (p) => KEYS.every((k) => Number(p?.[k]) === FINAL[k]);
const stat = (label, value, cls = "") => h("div", { class: "stat" }, h("div", { class: "label" }, label), h("div", { class: `value ${cls}` }, value));
function statsRow(label, s) {
  return h("tr", { class: s.n > 0 && s.n < 30 ? "weak" : "" },
    h("td", {}, label),
    h("td", { class: "num" }, s.n),
    h("td", { class: "num" }, pct(s.winPct)),
    h("td", {}, splitBar(s.winPct, s.lossPct)),
    h("td", { class: `num ${s.pf == null ? "" : signClass(s.pf - 1)}` }, num(s.pf)),
    h("td", { class: `num ${signClass(s.net)}` }, money(s.net)),
    h("td", { class: "num" }, money(s.avgWin)),
    h("td", { class: "num" }, money(s.avgLoss)),
    h("td", { class: "muted" }, s.n > 0 && s.n < 30 ? "ตัวอย่างน้อย" : ""));
}
const group = (t) => h("tr", { class: "group" }, h("td", { colspan: 9 }, t));
const statsTable = (rows) => h("div", { class: "table-wrap" }, h("table", {},
  h("thead", {}, h("tr", {}, ["", "เทรด", "ชนะ", "สัดส่วน", "PF", "Net", "เฉลี่ยไม้ชนะ", "เฉลี่ยไม้แพ้", ""].map((t, i) =>
    h("th", { class: [1, 2, 4, 5, 6, 7].includes(i) ? "num" : null }, t)))),
  h("tbody", {}, rows)));
const byKey = (trades, keyOf) => [...trades.reduce((m, t) => m.set(keyOf(t), [...(m.get(keyOf(t)) ?? []), t]), new Map())].sort(([a], [b]) => (a > b ? 1 : -1));
const MONTHS = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];

function equityChart(canvas, trades, start) {
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue("--accent").trim(), grid = css.getPropertyValue("--border").trim(), muted = css.getPropertyValue("--muted").trim();
  let bal = start;
  const sorted = [...trades].sort((a, b) => Date.parse(a.exitTime) - Date.parse(b.exitTime));
  const points = [{ x: Date.parse(sorted[0]?.entryTime ?? 0), y: start }, ...sorted.map((t) => ({ x: Date.parse(t.exitTime), y: (bal += t.net) }))];
  new Chart(canvas, {
    type: "line",
    data: { datasets: [
      { label: "เงินในบัญชี", data: points, borderColor: accent, borderWidth: 1.5, pointRadius: 0, tension: 0 },
      { label: "เงินต้น", data: [{ x: points[0].x, y: start }, { x: points.at(-1).x, y: start }], borderColor: muted, borderDash: [4, 4], borderWidth: 1, pointRadius: 0 },
    ] },
    options: {
      maintainAspectRatio: false, animation: false, parsing: false, normalized: true,
      interaction: { mode: "nearest", axis: "x", intersect: false },
      scales: {
        x: { type: "linear", grid: { color: grid }, ticks: { color: muted, maxTicksLimit: 8, callback: (v) => date(v) } },
        y: { grid: { color: grid }, ticks: { color: muted } },
      },
      plugins: {
        legend: { labels: { color: muted, boxWidth: 12 } },
        tooltip: { callbacks: { title: (items) => dateTime(items[0].parsed.x), label: (i) => ` ${i.dataset.label}: ${money(i.parsed.y)}` } },
      },
    },
  });
}

function periodSection(p, run, trades, canvas) {
  const long = p.key === "explore";
  const split = long ? (t) => t.entryTime.slice(0, 4) : (t) => t.entryTime.slice(0, 7);
  const label = long ? (k) => k : (k) => `${MONTHS[Number(k.slice(5, 7)) - 1]} ${k.slice(0, 4)}`;
  return h("section", { class: "stack" },
    h("h2", {}, `${p.label}: ${date(run.date_from)} – ${date(run.date_to)}`),
    h("p", { class: "muted" }, p.note),
    h("div", { class: "stats" },
      stat("Net", money(run.net_profit), signClass(run.net_profit)),
      stat("Profit factor", num(run.profit_factor)),
      stat("Win rate", pct(run.win_rate)),
      stat("จำนวนเทรด", run.total_trades),
      stat("Max drawdown", pct(run.max_dd_pct), "neg")),
    h("section", { class: "card" }, h("div", { class: "chart-box" }, canvas)),
    statsTable([
      group(long ? "รายปี" : "รายเดือน"), ...byKey(trades, split).map(([k, ts]) => statsRow(label(k), tradeStats(ts))),
      group("แยกตามฝั่ง"),
      statsRow("Buy", tradeStats(trades.filter((t) => t.side === "Buy"))), statsRow("Sell", tradeStats(trades.filter((t) => t.side === "Sell"))),
      group("แยกตามเวลาเข้า (เวลาไทย)"),
      ...byKey(trades, (t) => t.entryTime.slice(11, 13)).map(([k, ts]) => statsRow(`ไม้ที่เข้า ${thai(Number(k))} น.`, tradeStats(ts))),
      group("แยกตามวัน"), ...weekdayStats(trades).map((s, i) => statsRow(WEEKDAYS[i], s)),
    ]),
    h("p", {}, h("a", { href: `run.html?id=${run.id}` }, `ดูรอบ #${run.id}: รายการเทรดและกราฟตัวอย่าง →`)));
}

async function load() {
  mountJobs();
  const { data: runs, error } = await sb.from("backtest_runs")
    .select("*, strategy:strategies!inner(id, code, version, name, theory)")
    .eq("strategy.code", CODE).order("created_at", { ascending: false }).limit(200);
  if (error) throw error;

  const mine = runs.filter((r) => same(r.params) && Number(r.start_balance) === 1000);
  const found = PERIODS.map((p) => ({ p, run: mine.find((r) => (r.date_from ?? "") >= p.from && (r.date_from ?? "") < p.to) })).filter((x) => x.run);
  const main = $("#main"), jobs = $("#main .jobs");
  if (found.length < PERIODS.length) {
    main.replaceChildren(jobs, h("h1", {}, "สรุป"), h("p", { class: "empty" }, "ยังไม่มีผลทดสอบของทฤษฎีตัวเต็งครบทั้ง 3 ช่วง"));
    return;
  }
  const files = await Promise.all(found.map((x) => labApi(`/runs/${x.run.id}/file`)));
  const canvases = found.map((x) => h("canvas", { "aria-label": `เงินในบัญชี ${x.p.label}` }));
  const allPass = found.every((x) => x.run.net_profit > 0);
  const worstDd = Math.max(...found.map((x) => x.run.max_dd_pct ?? 0));

  main.replaceChildren(
    jobs,
    h("div", {},
      h("h1", {}, "สรุป: ทฤษฎีที่ดีที่สุดตอนนี้"),
      h("p", { class: "muted" }, "ทอง XAUUSD · แท่ง M1 จริง · ต้นทุนบัญชี Razor (0.22 ดอลลาร์ต่อออนซ์ต่อรอบ) · เงินต้น 1,000 · 0.01 lot ต่อไม้ · ปิดทุกไม้ก่อนหมดวัน")),
    h("section", { class: "card" },
      h("h2", {}, allPass ? "กำไรหลังหักต้นทุนครบทั้ง 3 ช่วง — แต่ยังไม่ใช่ข้อพิสูจน์" : "ยังไม่ผ่านครบทั้ง 3 ช่วง"),
      h("p", {}, h("b", {}, found[0].run.strategy.name), ": ", found[0].run.strategy.theory),
      h("p", {}, "กฎนี้ถูกล็อกจากช่วงสำรวจ แล้วจึงเปิดดูช่วงตรวจสอบและช่วงสุดท้ายอย่างละครั้ง ",
        allPass ? "ทั้งสามช่วงเป็นบวก " : "", `แต่ drawdown สูงสุดถึง ${pct(worstDd)} ของบัญชี ซึ่งสูงเกินกว่าจะใช้จริงด้วยขนาดไม้นี้ `,
        "และ backtest พิสูจน์กำไรจริงไม่ได้ ขั้นต่อไปคือทดสอบเดินหน้าในบัญชี Demo")),

    h("div", { class: "table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, ["ช่วง", "วันที่", "เทรด", "Win", "PF", "Net", "Max DD"].map((t, i) => h("th", { class: i >= 2 ? "num" : null }, t)))),
      h("tbody", {}, found.map(({ p, run }) => h("tr", { class: "link", tabindex: 0, onclick: () => location.href = `run.html?id=${run.id}` },
        h("td", {}, h("b", {}, p.label), h("span", { class: "muted" }, ` · ${p.note}`)),
        h("td", {}, `${date(run.date_from)} – ${date(run.date_to)}`),
        h("td", { class: "num" }, run.total_trades),
        h("td", { class: "num" }, pct(run.win_rate)),
        h("td", { class: "num" }, num(run.profit_factor)),
        h("td", { class: `num ${signClass(run.net_profit)}` }, money(run.net_profit)),
        h("td", { class: "num" }, pct(run.max_dd_pct))))))),

    h("section", { class: "card theory" },
      h("h2", {}, "ใช้ยังไง"),
      h("p", { class: "muted" }, "เวลาด้านล่างเป็นเวลาไทย · สองไม้เป็นอิสระต่อกัน ถือพร้อมกันได้สูงสุด 2 ไม้"),
      h("ol", {},
        h("li", {}, `จดราคาทองตอน ${thai(0)} น. (ต้นวันของตลาด)`),
        h("li", {}, `ตอน ${thai(FINAL.Hour1)} น. ดูว่าราคาห่างจากราคาต้นวันเท่าไร เทียบกับ "ขนาดปกติ" ของระยะห่างนี้ใน ${FINAL.Lookback} วันที่ผ่านมา`),
        h("li", {}, `ถ้าห่างเกิน ${FINAL.Threshold} เท่าของขนาดปกติ → เข้าตามทิศนั้น (ขึ้นมา = Buy, ลงมา = Sell) ถ้าไม่ถึง ไม่เข้า`),
        h("li", {}, `ตอน ${thai(FINAL.Hour2)} น. ทำแบบเดียวกันอีกครั้งเป็นไม้ที่สอง`),
        h("li", {}, "ถือทุกไม้ถึง 03:45 น. แล้วปิด ไม่ว่ากำไรหรือขาดทุน · รุ่นนี้ยังไม่มี SL/TP")),
      h("p", { class: "muted" }, "\"ขนาดปกติ\" คือรากของค่าเฉลี่ยกำลังสองของระยะห่างเดียวกันใน 60 วันทำการก่อนหน้า cBot คำนวณให้เอง (ทฤษฎี CH_SESSION_MOM)")),

    ...found.map((x, i) => periodSection(x.p, x.run, files[i].trades ?? [], canvases[i])),

    h("section", { class: "card" },
      h("h2", {}, "ข้อควรระวัง"),
      h("ul", {},
        h("li", {}, "Drawdown สูงมาก: 0.01 lot คือขนาดเล็กสุดที่เทรดได้ และที่ราคาทองปัจจุบันหนึ่งไม้แกว่งได้หลายสิบดอลลาร์ต่อวัน บัญชี 1,000 ดอลลาร์จึงเล็กเกินไปสำหรับกฎนี้"),
        h("li", {}, "กำไรมาจากปีที่ตลาดแกว่งแรง (2020, 2024–2026) ส่วนปี 2021–2023 แทบเท่าทุน"),
        h("li", {}, "ช่วงสุดท้ายมีเทรดแค่ราวร้อยครั้ง สามเดือนแรกขาดทุน และฝั่ง Sell ติดลบ — กำไรรวมของช่วงนี้ยังอาจเป็นโชคได้"),
        h("li", {}, "ทฤษฎีนี้ถูกเลือกจากการทดสอบหลายสิบแบบ จึงมีโอกาสที่มันดูดีเพราะบังเอิญ"),
        h("li", {}, "คิดสเปรดคงที่ ไม่มี slippage และยังไม่ได้วัดสเปรดจริงของบัญชี"),
        h("li", {}, "ทฤษฎีรวมรุ่นก่อน (เบรก High วันก่อน + กรอบเอเชีย) ไม่ผ่านช่วงสุดท้าย ดูได้ในหน้าทฤษฎีกราฟ"))),
  );
  found.forEach((x, i) => { const t = files[i].trades ?? []; if (t.length) equityChart(canvases[i], t, Number(x.run.start_balance)); });
}

const session = await requireSession();
if (session) {
  try { await load(); } catch (e) { $("#main").replaceChildren(); showError(e); }
}
</script>
</body>
</html>
