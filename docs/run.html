<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backtest Lab · รายละเอียดรอบทดสอบ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stack" id="main"><p class="muted">กำลังโหลด…</p></main>
<script type="module">
import Chart from "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/auto/+esm";
import { sb, requireSession, labApi, h, $, money, pct, num, date, dateTime, signClass, describe, showError,
  WEEKDAYS, tradeWeekday, tradeStats, weekdayStats, splitBar } from "./app.js";

const id = Number(new URLSearchParams(location.search).get("id"));
const stat = (label, value, cls = "") => h("div", { class: "stat" }, h("div", { class: "label" }, label), h("div", { class: `value ${cls}` }, value));

function theoryCard(run) {
  const s = run.strategy ?? {};
  const params = run.params ?? {};
  return h("section", { class: "card theory" },
    h("h2", {}, "ทฤษฎีที่ใช้ในรอบนี้"),
    h("div", { class: "name" }, s.name ?? "–"),
    h("div", { class: "code" }, `${s.code} · version ${s.version}`),
    s.theory && h("p", {}, s.theory),
    h("h3", {}, "เข้าเมื่อ"), h("ol", {}, (s.entry_rules ?? []).map((r) => h("li", {}, describe(r, params)))),
    h("h3", {}, "ออกเมื่อ"), h("ul", {}, (s.exit_rules ?? []).map((r) => h("li", {}, describe(r, params)))),
    h("h3", {}, "ค่าที่ตั้ง"), h("div", { class: "chips" },
      Object.entries(params).map(([k, v]) => h("span", { class: "chip" }, `${k} `, h("b", {}, v)))),
    s.notes && [h("h3", {}, "โน้ตของทฤษฎี"), h("p", {}, s.notes)],
  );
}

function noteCard(run) {
  const ta = h("textarea", { "aria-label": "โน้ตของรอบนี้" });
  ta.value = run.note ?? "";
  const status = h("span", { class: "muted" });
  return h("section", { class: "card" },
    h("h2", {}, "โน้ตของรอบนี้"),
    ta,
    h("div", { class: "toolbar" },
      h("button", {
        onclick: async () => {
          const { error } = await sb.from("backtest_runs").update({ note: ta.value || null }).eq("id", run.id);
          status.textContent = error ? `บันทึกไม่ได้: ${error.message}` : "บันทึกแล้ว";
        },
      }, "บันทึกโน้ต"), status),
    h("p", { class: "muted" }, `เครื่อง: ${run.machine ?? "–"} · โหมด: ${run.running_mode ?? "–"} · ส่งเมื่อ ${dateTime(run.created_at)}`),
  );
}

/** ลบแถวใน Supabase + ย้ายไฟล์ Drive ลงถังขยะ (ผ่าน "lab"); ถ้า lab ยังเป็นรุ่นเก่า ลบได้แค่แถว */
async function deleteRun(run, status) {
  if (!confirm(`ลบรอบทดสอบ #${run.id} ถาวร?\nไฟล์รายละเอียดใน Google Drive จะถูกย้ายลงถังขยะ`)) return;
  status.textContent = "กำลังลบ…";
  let message = "";
  try {
    const res = await labApi(`/runs/${run.id}`, "DELETE");
    if (res.driveError) message = `ลบแล้ว แต่ย้ายไฟล์ Drive ลงถังขยะไม่ได้: ${res.driveError}`;
  } catch (apiError) {
    const { data, error } = await sb.from("backtest_runs").delete().eq("id", run.id).select("id");
    if (error || !data?.length) {
      status.textContent = `ลบไม่ได้: ${error?.message ?? apiError.message}`;
      return;
    }
    message = "ลบจากฐานข้อมูลแล้ว แต่ไฟล์ใน Google Drive ยังอยู่ (Edge Function lab ยังไม่รองรับการลบ)";
  }
  if (message) alert(message);
  location.href = "index.html";
}

function dangerCard(run) {
  const status = h("span", { class: "muted" });
  return h("section", { class: "toolbar" },
    h("button", { class: "danger", onclick: () => deleteRun(run, status) }, "ลบรอบทดสอบนี้"), status);
}

function equityChart(canvas, points, startBalance) {
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue("--accent").trim(), grid = css.getPropertyValue("--border").trim(), muted = css.getPropertyValue("--muted").trim();
  new Chart(canvas, {
    type: "line",
    data: {
      datasets: [
        { label: "Equity", data: points.map(([t, y]) => ({ x: t * 1000, y })), borderColor: accent, borderWidth: 1.5, pointRadius: 0, tension: 0 },
        { label: "ทุนเริ่มต้น", data: points.length ? [{ x: points[0][0] * 1000, y: startBalance }, { x: points.at(-1)[0] * 1000, y: startBalance }] : [],
          borderColor: muted, borderDash: [4, 4], borderWidth: 1, pointRadius: 0 },
      ],
    },
    options: {
      maintainAspectRatio: false, animation: false, parsing: false, normalized: true,
      interaction: { mode: "index", intersect: false },
      scales: {
        x: { type: "linear", grid: { color: grid }, ticks: { color: muted, maxTicksLimit: 8, callback: (v) => date(v) } },
        y: { grid: { color: grid }, ticks: { color: muted } },
      },
      plugins: {
        legend: { labels: { color: muted, boxWidth: 12 } },
        tooltip: { callbacks: { title: (items) => dateTime(items[0].parsed.x), label: (i) => ` ${i.dataset.label}: ${money(i.parsed.y)}` } },
      },
    },
  });
}

// ---------- แยกตามวันในสัปดาห์ ----------
function weekdayTable(trades) {
  const head = ["วัน", "เทรด", "ชนะ", "แพ้", "สัดส่วน", "PF", "Net", "เฉลี่ยไม้ชนะ", "เฉลี่ยไม้แพ้", "ถือเฉลี่ย (นาที)", ""];
  const row = (label, s, cls = "") => h("tr", { class: cls || (s.n < 30 ? "weak" : "") },
    h("td", {}, label),
    h("td", { class: "num" }, s.n),
    h("td", { class: "num" }, pct(s.winPct)),
    h("td", { class: "num" }, pct(s.lossPct)),
    h("td", {}, splitBar(s.winPct, s.lossPct)),
    h("td", { class: "num" }, num(s.pf)),
    h("td", { class: `num ${signClass(s.net)}` }, money(s.net)),
    h("td", { class: "num" }, money(s.avgWin)),
    h("td", { class: "num" }, money(s.avgLoss)),
    h("td", { class: "num" }, s.avgMinutes == null ? "–" : Math.round(s.avgMinutes)),
    h("td", {}, s.n > 0 && s.n < 30 ? h("span", { class: "tag" }, "ตัวอย่างน้อย (< 30)") : ""),
  );
  return h("section", { class: "stack" },
    h("h2", {}, "ผลแยกตามวันในสัปดาห์"),
    h("p", { class: "muted" }, "นับตามวันที่เข้าเทรด (เวลา UTC) · PF มากกว่า 1 = วันนั้นกำไรรวมมากกว่าขาดทุนรวม · win rate สูงไม่ได้แปลว่ากำไร ต้องดูคู่กับขนาดไม้ชนะ/ไม้แพ้"),
    h("div", { class: "table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, head.map((t, i) => h("th", { class: i > 0 && i !== 4 && i !== 10 ? "num" : null }, t)))),
      h("tbody", {}, weekdayStats(trades).map((s, i) => row(WEEKDAYS[i], s)), row("รวมทุกวัน", tradeStats(trades), "group")),
    )));
}

// ---------- ตัวอย่างกราฟ: ทรงที่ทำให้เกิดสัญญาณ แล้วราคาไปต่อยังไง ----------
const SVG = "http://www.w3.org/2000/svg";
const s = (tag, attrs = {}, ...kids) => {
  const el = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  el.append(...kids);
  return el;
};
// เวลาท้องถิ่นของผู้ดู ให้ตรงกับหัวกราฟและตารางเทรด
const hhmm = (unix) => new Date(unix * 1000).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });

function candleChart(t) {
  const W = 560, H = 250, L = 8, R = 88, T = 10, B = 20;
  const bars = t.bars, n = bars.length;
  const entryUnix = Date.parse(t.entryTime) / 1000, exitUnix = Date.parse(t.exitTime) / 1000;
  const indexAt = (unix) => { let i = 0; while (i + 1 < n && bars[i + 1][0] <= unix) i++; return i; };
  const ei = indexAt(entryUnix), xi = indexAt(exitUnix), exitShown = bars[n - 1][0] + 60 > exitUnix;

  const prices = bars.flatMap((b) => [b[2], b[3]]).concat([t.sl, t.tp].filter((v) => v != null));
  const lo = Math.min(...prices), hi = Math.max(...prices), span = hi - lo || 1;
  const step = (W - L - R) / n, bw = Math.max(1, step * 0.64);
  const x = (i) => L + step * (i + 0.5), y = (p) => T + (1 - (p - lo) / span) * (H - T - B);

  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": `กราฟแท่งเทียนรอบเทรด #${t.id} ${t.side} ผล ${t.net}` });
  bars.forEach((b, i) => {
    const up = b[4] >= b[1], top = y(Math.max(b[1], b[4])), bottom = y(Math.min(b[1], b[4]));
    svg.append(s("g", { class: up ? "cu" : "cd" },
      s("title", {}, `${hhmm(b[0])}  O ${b[1]}  H ${b[2]}  L ${b[3]}  C ${b[4]}`),
      s("line", { x1: x(i), x2: x(i), y1: y(b[2]), y2: y(b[3]), "stroke-width": 1 }),
      s("rect", { x: x(i) - bw / 2, y: top, width: bw, height: Math.max(1, bottom - top), "stroke-width": 0 })));
  });

  const level = (price, label, color) => price != null && svg.append(
    s("line", { class: "lvl", x1: x(ei), x2: x(exitShown ? xi : n - 1), y1: y(price), y2: y(price), stroke: color }),
    s("text", { x: W - R + 6, y: y(price) + 4 }, `${label} ${price}`));
  level(t.tp, "TP", "var(--pos)");
  level(t.sl, "SL", "var(--neg)");

  svg.append(
    s("line", { class: "entry", x1: x(ei), x2: x(ei), y1: T, y2: H - B }),
    s("text", { x: x(ei), y: H - 6, "text-anchor": "middle" }, `เข้า ${hhmm(entryUnix)}`));
  if (exitShown) svg.append(
    s("line", { class: "path", x1: x(ei), y1: y(t.entryPrice), x2: x(xi), y2: y(t.exitPrice) }),
    s("circle", { class: "dot", cx: x(xi), cy: y(t.exitPrice), r: 4 }, s("title", {}, `ออก ${hhmm(exitUnix)} ที่ ${t.exitPrice}`)));
  svg.append(s("circle", { class: "dot", cx: x(ei), cy: y(t.entryPrice), r: 4 }, s("title", {}, `เข้า ${t.side} ที่ ${t.entryPrice}`)));
  return svg;
}

function examples(trades) {
  const list = trades.filter((t) => Array.isArray(t.bars) && t.bars.length > 1);
  if (!list.length) return "";
  let wd = -1, outcome = "";
  const grid = h("div", { class: "examples" });
  const draw = () => {
    const shown = list.filter((t) => (wd < 0 || tradeWeekday(t) === wd) && (!outcome || (outcome === "win") === (t.net > 0)));
    grid.replaceChildren(...(shown.length ? shown.map((t) => {
      const minutes = Math.round((Date.parse(t.exitTime) - Date.parse(t.entryTime)) / 60000);
      return h("figure", { class: "card example", style: "margin:0" },
        h("figcaption", {},
          h("b", {}, `${WEEKDAYS[tradeWeekday(t)]} ${dateTime(t.entryTime)}`), ` · ${t.side} · `,
          h("span", { class: signClass(t.net) }, `${t.net > 0 ? "ชนะ" : "แพ้"} ${money(t.net)} (${num(t.pips)} pips)`),
          h("span", { class: "muted" }, ` · ถือ ${minutes} นาที · #${t.id}`)),
        candleChart(t));
    }) : [h("p", { class: "empty" }, "ไม่มีตัวอย่างที่ตรงเงื่อนไข")]));
  };
  const tabs = h("div", { class: "tabs", role: "group", "aria-label": "เลือกวัน" });
  const tab = (label, i) => h("button", { "aria-pressed": String(wd === i), onclick: () => { wd = i; paint(); } }, label);
  const sel = h("select", { "aria-label": "กรองผล", oninput: (e) => { outcome = e.target.value; draw(); } },
    h("option", { value: "" }, "ทั้งชนะและแพ้"), h("option", { value: "win" }, "เฉพาะที่ชนะ"), h("option", { value: "loss" }, "เฉพาะที่แพ้"));
  const paint = () => { tabs.replaceChildren(tab("ทุกวัน", -1), ...WEEKDAYS.map(tab), sel); draw(); };
  paint();
  return h("section", { class: "stack" },
    h("h2", {}, `ตัวอย่างกราฟตอนเกิดสัญญาณ (${list.length})`),
    h("p", { class: "muted" },
      "แท่งทางซ้ายของเส้นประแนวตั้ง = ทรงที่ทำให้เกิดสัญญาณ · ทางขวา = สิ่งที่เกิดขึ้นหลังเข้า · เส้นประเขียว/แดง = TP/SL · วงกลม = จุดเข้าและจุดออก · ",
      "ตัวอย่างถูกเลือกแบบกระจายตามช่วงเวลา (ชนะ 2 แพ้ 2 ต่อวัน) ไม่ได้คัดเฉพาะอันที่สวย"),
    tabs, grid);
}

function tradesTable(trades) {
  const shown = trades.slice(-1000);
  return h("section", { class: "stack" },
    h("h2", {}, `รายการเทรด (${trades.length})`),
    trades.length > shown.length && h("p", { class: "muted" }, `แสดง ${shown.length} รายการล่าสุด`),
    h("div", { class: "table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, ["#", "ฝั่ง", "เข้า", "ออก", "ราคาเข้า", "ราคาออก", "Pips", "Net"].map((t, i) =>
        h("th", { class: i >= 4 ? "num" : null }, t)))),
      h("tbody", {}, shown.map((t, i) => h("tr", {},
        h("td", { class: "num" }, trades.length - shown.length + i + 1),
        h("td", {}, t.side),
        h("td", { class: "mono" }, dateTime(t.entryTime)),
        h("td", { class: "mono" }, dateTime(t.exitTime)),
        h("td", { class: "num" }, t.entryPrice),
        h("td", { class: "num" }, t.exitPrice),
        h("td", { class: `num ${signClass(t.pips)}` }, num(t.pips)),
        h("td", { class: `num ${signClass(t.net)}` }, money(t.net)),
      ))),
    )),
  );
}

const session = await requireSession();
if (session) {
  const main = $("#main");
  try {
    const { data: run, error } = await sb.from("backtest_runs")
      .select("*, strategy:strategies(*)").eq("id", id).maybeSingle();
    if (error) throw error;
    if (!run) { main.replaceChildren(h("p", { class: "empty" }, "ไม่พบรอบทดสอบนี้")); throw null; }

    document.title = `Backtest Lab · #${run.id} ${run.strategy?.name ?? ""}`;
    const canvas = h("canvas", { "aria-label": "กราฟ equity" });
    const fileArea = h("div", { class: "stack" }, h("p", { class: "muted" }, "กำลังโหลดรายการเทรดจาก Google Drive…"));

    main.replaceChildren(
      h("p", {}, h("a", { href: "index.html" }, "← ผลทดสอบทั้งหมด")),
      h("div", {},
        h("h1", {}, `#${run.id} · ${run.strategy?.name ?? ""} · ${run.symbol} ${run.timeframe}`),
        h("p", { class: "muted" }, `ข้อมูล ${date(run.date_from)} – ${date(run.date_to)}`)),
      h("div", { class: "stats" },
        stat("Net profit", money(run.net_profit), signClass(run.net_profit)),
        stat("ทุน เริ่ม → จบ", `${money(run.start_balance)} → ${money(run.end_balance)}`),
        stat("Win rate", pct(run.win_rate)),
        stat("Profit factor", num(run.profit_factor)),
        stat("Max drawdown", pct(run.max_dd_pct)),
        stat("จำนวนเทรด", run.total_trades ?? "–")),
      h("div", { class: "grid two" }, theoryCard(run), noteCard(run)),
      h("section", { class: "card" }, h("h2", {}, "Equity"), h("div", { class: "chart-box" }, canvas)),
      fileArea,
      dangerCard(run),
    );

    if (!run.drive_file_id) {
      fileArea.replaceChildren(h("p", { class: "notice" }, `ไม่มีไฟล์รายละเอียดใน Drive${run.drive_error ? `: ${run.drive_error}` : ""}`));
    } else {
      const file = await labApi(`/runs/${run.id}/file`);
      equityChart(canvas, file.equity ?? [], run.start_balance);
      const trades = file.trades ?? [];
      fileArea.replaceChildren(weekdayTable(trades), examples(trades), tradesTable(trades));
    }
  } catch (e) { if (e) showError(e); }
}
</script>
</body>
</html>
